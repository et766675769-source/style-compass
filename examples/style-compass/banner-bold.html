<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · Banner · bold-playful</title>
<!-- 风格: bold-playful (高饱和撞色 · 怪诞大字) · 应用新规则: 信息块化(色块独立) + 块间呼吸 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFD400;--orange:#FF5A00;--red:#E63946;--green:#A3E635;--ink:#0B0B10;--cream:#FFF6E5;
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;--en:'Montserrat','Noto Sans SC',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#1a1a1a;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:28px;-webkit-font-smoothing:antialiased}
  .banner{width:min(94vw,1100px);aspect-ratio:21/9;position:relative;background:var(--bg);display:flex;align-items:stretch;gap:28px;border:4px solid var(--ink);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .left{flex:1.6;padding:32px 34px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;letter-spacing:-.02em;margin-bottom:24px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--ink)}
  .brand small{font-family:var(--en);font-size:10px;font-weight:800;letter-spacing:.1em;margin-left:6px}
  h1{font-weight:900;line-height:.94;letter-spacing:-.03em;font-size:clamp(2.4rem,5vw,4rem);color:var(--ink);text-transform:uppercase}
  h1 .hl{color:var(--orange)} h1 .outline{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
  .tagline{display:inline-block;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;letter-spacing:.2em;padding:8px 14px;margin-bottom:18px;text-transform:uppercase;font-family:var(--en)}
  .r{flex:1;display:flex;flex-direction:row;flex-wrap:wrap;gap:18px;padding:20px 26px;align-content:center;background:var(--bg);border-left:4px solid var(--ink)}
  .blk{border:3px solid var(--ink);padding:16px 18px;background:var(--bg);flex:1 1 40%;min-width:180px}
  .blk .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink);opacity:.75;margin-bottom:8px}
  .blk .v{font-family:var(--en);font-size:16px;font-weight:900;color:var(--ink)}
  .b-orange{background:var(--orange)} .b-red{background:var(--red);color:var(--cream)} .b-green{background:var(--green)} .b-cream{background:var(--cream)} .b-purple{background:#A78BFA}
  .b-red .k{color:var(--cream)} .b-red .v{color:var(--cream)}
  .foot{position:absolute;bottom:0;left:0;right:0;padding:14px 34px;background:linear-gradient(90deg,var(--orange),var(--red));border-top:4px solid var(--ink);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--cream);font-weight:800}
  .foot b{color:var(--ink)}
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="brand"><span class="dot"></span> Style Compass <small>OPEN SOURCE</small></div>
      <span class="tagline">Give AI Taste</span>
      <h1>让 AI<br>有<span class="hl">设计</span><span class="outline">品味</span></h1>
    </div>
    <div class="r">
      <div class="blk b-orange"><div class="k">编辑留白</div><div class="v">editorial-calm</div></div>
      <div class="blk b-cream"><div class="k">素雅极简</div><div class="v">clean-minimal</div></div>
      <div class="blk b-green"><div class="k">暗夜玻璃</div><div class="v">dark-glass</div></div>
      <div class="blk b-red"><div class="k">撞色怪诞</div><div class="v">bold-playful</div></div>
      <div class="blk b-purple"><div class="k">暗调辉光</div><div class="v">dark-glow</div></div>
    </div>
    <div class="foot"><span><b>规范与介质解耦</b> · 审美可参数化</span><span>✦</span></div>
  </div>
</body>
</html>
