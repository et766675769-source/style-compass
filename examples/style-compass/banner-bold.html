<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · Banner · bold-playful</title>
<!-- 风格: bold-playful (高饱和撞色 · 怪诞大字) · 右侧改竖直清单避免裁切 · 统一英文 Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFD400;--orange:#FF5A00;--red:#E63946;--green:#A3E635;--purple:#A78BFA;--cream:#FFF6E5;--ink:#0B0B10;
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;--en:'Montserrat','Noto Sans SC',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#1a1a1a;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:28px;-webkit-font-smoothing:antialiased}
  .banner{width:min(94vw,1100px);aspect-ratio:21/9;position:relative;background:var(--bg);display:flex;align-items:stretch;border:4px solid var(--ink);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .left{flex:1.6;padding:26px 30px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:-.02em;margin-bottom:18px;font-family:var(--en);white-space:nowrap}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--ink);flex-shrink:0;flex:none}
  .brand small{font-size:10px;font-weight:800;letter-spacing:.12em;margin-left:6px}
  h1{font-weight:900;line-height:.96;letter-spacing:-.03em;font-size:clamp(2.2rem,4.6vw,3.7rem);color:var(--ink);text-transform:uppercase;white-space:nowrap}
  h1 .hl{color:var(--orange)} h1 .outline{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
  .tagline{display:inline-block;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;letter-spacing:.2em;padding:7px 14px;margin-bottom:16px;text-transform:uppercase;font-family:var(--en);white-space:nowrap}
  /* 右侧：竖直清单，5 个紧凑块，Z 轴层叠(微旋转) + 弹簧按压 */
  .r{flex:1;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--bg);border-left:4px solid var(--ink)}
  .r .cap{font-family:var(--en);font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--ink);opacity:.7;text-transform:uppercase;margin-bottom:2px}
  .blk{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);padding:9px 14px;transition:transform .35s cubic-bezier(.32,.72,0,1),box-shadow .35s cubic-bezier(.32,.72,0,1)}
  .blk:hover{transform:scale(1.03);box-shadow:3px 3px 0 var(--ink)}
  .blk:nth-child(2){transform:rotate(-.6deg)} .blk:nth-child(4){transform:rotate(.6deg)}
  .blk .k{font-size:12px;font-weight:800;color:var(--ink);width:76px}
  .blk .v{font-family:var(--en);font-size:13px;font-weight:900;color:var(--ink);margin-left:auto;letter-spacing:-.01em;white-space:nowrap}
  .b-orange{background:var(--orange)} .b-red{background:var(--red)} .b-green{background:var(--green)} .b-purple{background:var(--purple)} .b-cream{background:var(--cream)}
  .foot{position:absolute;bottom:0;left:0;right:0;padding:11px 30px;background:linear-gradient(90deg,var(--orange),var(--red));border-top:4px solid var(--ink);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--cream);font-weight:800}
  .foot b{color:var(--ink)}
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="brand"><span class="dot"></span> Style Compass <small>OPEN SOURCE</small></div>
      <span class="tagline">Give AI Taste</span>
      <h1>让 AI 有<span class="hl">设计</span><span class="outline">品味</span></h1>
    </div>
    <div class="r">
      <div class="cap">Five Styles</div>
      <div class="blk b-orange"><span class="k">编辑留白</span><span class="v">editorial-calm</span></div>
      <div class="blk b-cream"><span class="k">素雅极简</span><span class="v">clean-minimal</span></div>
      <div class="blk b-green"><span class="k">暗夜玻璃</span><span class="v">dark-glass</span></div>
      <div class="blk b-purple"><span class="k">暗调辉光</span><span class="v">dark-glow</span></div>
      <div class="blk b-red"><span class="k">撞色怪诞</span><span class="v">bold-playful</span></div>
    </div>
    <div class="foot"><span><b>规范与介质解耦</b> · 审美可参数化</span><span>✦</span></div>
  </div>
</body>
</html>
