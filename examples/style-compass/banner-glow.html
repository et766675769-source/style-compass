<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · Banner · dark-glow</title>
<!-- 风格: dark-glow (暗调辉光 · 戏剧沉浸) · 新闻规则: 信息块化 + 块间呼吸 + 单光源(橙) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#140B0B;--ink:#F5EBD9;--dim:rgba(245,235,217,.6);--glow:#E85D3A;--glow2:#FFB347;--line:rgba(245,235,217,.12);
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;--en:'Montserrat','Noto Sans SC',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:28px;-webkit-font-smoothing:antialiased}
  .banner{width:min(94vw,1100px);aspect-ratio:21/9;position:relative;background:var(--bg);overflow:hidden;display:flex;align-items:stretch;box-shadow:0 40px 90px rgba(0,0,0,.7)}
  .banner::before{content:'';position:absolute;inset:0;
    background:radial-gradient(560px 320px at 82% 10%,rgba(232,93,58,.5),transparent 60%),
      radial-gradient(500px 320px at 6% 100%,rgba(255,179,71,.3),transparent 60%),
      radial-gradient(360px 280px at 55% 55%,rgba(232,93,58,.16),transparent 60%)}
  .inner{position:relative;z-index:1;display:flex;align-items:center;gap:40px;padding:30px 40px;flex:1}
  .left{flex:1.5;min-width:0}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--en);font-weight:700;font-size:15px;margin-bottom:24px;white-space:nowrap}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--glow);box-shadow:0 0 16px rgba(232,93,58,.8);flex-shrink:0;flex:none}
  .brand small{font-family:var(--en);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-left:6px}
  .tag{font-family:var(--en);font-size:11px;letter-spacing:.26em;color:var(--glow2);text-transform:uppercase;margin-bottom:20px}
  h1{font-weight:900;line-height:1.04;letter-spacing:-.03em;font-size:clamp(2.1rem,4.6vw,3.6rem);white-space:nowrap}
  h1 .l1{color:var(--ink);text-shadow:0 0 30px rgba(255,179,71,.4)}
  h1 .l2{color:var(--glow2);text-shadow:0 0 34px rgba(232,93,58,.7)}
  .lead{margin-top:22px;font-size:13px;color:var(--dim);line-height:1.8;max-width:430px}
  .right{flex:1;display:flex;flex-direction:column;justify-content:center}
  .right .cap{font-family:var(--en);font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:13px;background:rgba(255,235,217,.04);backdrop-filter:blur(5px);margin-bottom:11px}
  .row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor}
  .row .cn{font-size:13px;font-weight:700;color:var(--ink)}
  .row .en{font-family:var(--en);font-size:10px;color:var(--dim);margin-left:auto;letter-spacing:.04em}
  .c1{color:var(--glow2)}.c2{color:#FF6B6B}.c3{color:#FFB347}.c4{color:#FF8C5A}.c5{color:#FFD166}
</style>
</head>
<body>
  <div class="banner">
    <div class="inner">
      <div class="left">
        <div class="brand"><span class="dot"></span> Style Compass <small>OPEN SOURCE</small></div>
        <div class="tag">Give AI Taste</div>
        <h1><span class="l1">让 AI 有</span><span class="l2">设计品味</span></h1>
        <p class="lead">把认可的高审美案例，蒸馏成介质无关的视觉规范——一套品味，网页 / PPT / UI / 平面通吃。</p>
      </div>
      <div class="right">
        <div class="cap">Five Styles</div>
        <div class="row"><span class="dot c1"></span><span class="cn">编辑留白</span><span class="en">editorial-calm</span></div>
        <div class="row"><span class="dot c2"></span><span class="cn">暗夜玻璃</span><span class="en">dark-glass</span></div>
        <div class="row"><span class="dot c3"></span><span class="cn">暗调辉光</span><span class="en">dark-glow</span></div>
        <div class="row"><span class="dot c4"></span><span class="cn">撞色怪诞</span><span class="en">bold-playful</span></div>
        <div class="row"><span class="dot c5"></span><span class="cn">素雅极简</span><span class="en">clean-minimal</span></div>
      </div>
    </div>
  </div>
</body>
</html>
