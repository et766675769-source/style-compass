<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · 海报 · 暗调辉光版</title>
<!--
  style-compass 介质无关验证 · 海报 · 风格: style-dark-glow (暗调辉光 · 戏剧沉浸)
  气质: 暗底 + 光晕辉光 + 戏剧打光 + 情绪张力 + 大标题
  字体: 全无衬线开源 —— Noto Sans SC + Montserrat
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140B0B; --ink:#F5EBD9; --dim:rgba(245,235,217,.6);
    --glow:#E85D3A; --glow2:#FFB347;
    --line:rgba(245,235,217,.12);
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;
    --en:'Montserrat','Noto Sans SC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:36px;-webkit-font-smoothing:antialiased}
  .poster{
    width:min(92vw,520px);aspect-ratio:3/4;position:relative;background:var(--bg);overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.7);display:flex;flex-direction:column;
  }
  /* 光晕氛围层：贯穿全画布、更均衡 */
  .poster::before{content:'';position:absolute;inset:0;
    background:radial-gradient(400px 320px at 80% 6%,rgba(232,93,58,.55),transparent 62%),
      radial-gradient(460px 380px at 14% 92%,rgba(255,179,71,.34),transparent 60%),
      radial-gradient(360px 300px at 68% 62%,rgba(232,93,58,.22),transparent 60%),
      radial-gradient(300px 260px at 40% 40%,rgba(255,179,71,.14),transparent 62%)}
  .poster::after{content:'';position:absolute;inset:auto -10% -20% -10%;height:40%;
    background:radial-gradient(60% 100% at 50% 100%,rgba(255,179,71,.28),transparent 70%);filter:blur(20px)}
  .inner{position:relative;z-index:1;padding:30px 32px 46px;display:flex;flex-direction:column;flex:1}

  .top{display:flex;justify-content:space-between;align-items:center;font-family:var(--en);margin-bottom:60px}
  .brand{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .brand .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--glow);margin-right:8px;box-shadow:0 0 16px rgba(232,93,58,.8)}
  .meta{font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}

  .head{margin-bottom:auto}
  .tag{font-family:var(--en);font-size:10.5px;letter-spacing:.26em;color:var(--glow2);text-transform:uppercase;margin-bottom:20px}
  .head h1{font-weight:900;line-height:1.02;letter-spacing:-.03em;font-size:clamp(3rem,13vw,4.2rem)}
  .head h1 .l1,.head h1 .l2{display:block}
  .head h1 .l2 .l3{display:inline}
  .head h1 .l1{color:var(--ink);text-shadow:0 0 30px rgba(255,179,71,.4)}
  .head h1 .l2{color:var(--glow2);text-shadow:0 0 34px rgba(232,93,58,.7)}
  .head h1 .l3{color:var(--ink)}
  .head .sub{font-size:11.5px;color:var(--dim);margin-top:24px;margin-bottom:30px;max-width:80%;line-height:1.8}

  /* 风格列表：单列竖向光点列表，聚焦不散 */
  .styles-cap{font-family:var(--en);font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}
  .list{margin-top:auto;display:flex;flex-direction:column;gap:11px}
  .chip{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:13px;background:rgba(255,235,217,.04);backdrop-filter:blur(5px);transition:.2s}
  .chip:hover{border-color:rgba(255,179,71,.5);transform:translateX(3px)}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor}
  .chip .cn{font-size:13px;font-weight:700;color:var(--ink)}
  .chip .en{font-family:var(--en);font-size:10px;color:var(--dim);margin-left:auto;letter-spacing:.04em}
  .c1{color:var(--glow2)}.c2{color:#FF6B6B}.c3{color:#FFB347}.c4{color:#FF8C5A}.c5{color:#FFD166}

  .foot{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .foot .t{font-size:10.5px;color:var(--dim)}
  .foot .t b{color:var(--ink);font-weight:700}
</style>
</head>
<body>
  <div class="poster">
    <div class="inner">
      <div class="top">
        <div class="brand"><span class="dot"></span>Style Compass</div>
        <div class="meta">Open Source</div>
      </div>
      <div class="head">
        <div class="tag">Give AI Taste</div>
        <h1><span class="l1">让 AI</span><span class="l2">有设计<span class="l3">品味</span></span></h1>
        <p class="sub">把认可的高审美案例，蒸馏成介质无关的视觉规范——一套品味，网页、PPT、UI、平面通吃。</p>
      </div>
      <div class="list">
        <div class="chip"><span class="dot c1"></span><span class="cn">编辑留白</span><span class="en">editorial-calm</span></div>
        <div class="chip"><span class="dot c2"></span><span class="cn">暗夜玻璃</span><span class="en">dark-glass</span></div>
        <div class="chip"><span class="dot c3"></span><span class="cn">暗调辉光</span><span class="en">dark-glow</span></div>
        <div class="chip"><span class="dot c4"></span><span class="cn">撞色怪诞</span><span class="en">bold-playful</span></div>
        <div class="chip"><span class="dot c5"></span><span class="cn">素雅极简</span><span class="en">clean-minimal</span></div>
      </div>
      <div class="foot">
        <div class="t"><b>规范与介质解耦</b> · 审美可参数化</div>
        <div class="t">✦</div>
      </div>
    </div>
  </div>
</body>
</html>
