<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · 海报 · 明亮版</title>
<!--
  style-compass 介质无关验证 · 海报 · 风格: style-clean-minimal (明亮呼吸版v2)
  改进: 加大呼吸(真正留白) + 非对称左对齐大字 + 错落节奏 + 主次分明
  字体: 全无衬线开源 —— Noto Sans SC + Montserrat
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;800;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8; --ink:#1E1E1E; --dim:#7A7A76; --faint:#B4B4AF;
    --blue:#2F6BFF; --green:#00A86B; --purple:#7A5AF8; --orange:#E85D3A; --red:#FF5A00;
    --line:rgba(30,30,30,.1);
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;
    --en:'Montserrat','Noto Sans SC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#E9E9E5;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:36px;-webkit-font-smoothing:antialiased}
  .poster{
    width:min(92vw,520px);aspect-ratio:3/4;border-radius:18px;overflow:hidden;position:relative;
    background:var(--paper);border:1px solid rgba(0,0,0,.03);box-shadow:0 30px 70px rgba(0,0,0,.12);
    padding:30px 32px 34px;display:flex;flex-direction:column;
  }
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
  .logo{display:flex;align-items:center;gap:9px;font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:-.02em}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--blue)}
  .mini{font-family:var(--en);font-size:11px;color:var(--faint);letter-spacing:.14em;font-weight:600}

  /* 标题区：左对齐大字 + 极强留白 */
  .head{margin-bottom:auto}
  .tag{font-family:var(--en);font-size:11px;letter-spacing:.22em;color:var(--blue);font-weight:700;text-transform:uppercase;margin-bottom:26px}
  .head h1{font-weight:900;line-height:.98;letter-spacing:-.04em;font-size:clamp(2.8rem,12vw,4rem);color:var(--ink)}
  .head h1 .hl{color:var(--blue)}
  .head h1 .ghost{color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.55}
  .head p{font-size:12px;color:var(--dim);margin-top:30px;max-width:78%;line-height:1.7;font-weight:500}

  /* 五风格：中性单色（去彩色撞色，蓝色只留给主标题）—— 克制、干净、单一重点 */
  .styles{margin-top:auto;padding-top:26px}
  .styles .cap{font-family:var(--en);font-size:10px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}
  .list{display:flex;flex-direction:column;gap:0}
  .item{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .item .num{font-family:var(--en);font-size:11px;color:var(--faint);width:24px;flex-shrink:0;letter-spacing:.04em}
  .item .cn{font-size:13.5px;font-weight:500;color:var(--ink);width:82px;flex-shrink:0}
  .item .en{font-family:var(--en);font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.01em}

  .foot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .foot .t{font-size:11px;color:var(--faint);font-weight:600}
  .foot .t b{color:var(--ink)}
  .foot .mark{font-size:13px;color:var(--blue)}
</style>
</head>
<body>
  <div class="poster">
    <div class="top">
      <div class="logo"><span class="dot"></span> Style Compass</div>
      <div class="mini">OPEN SOURCE</div>
    </div>
    <div class="head">
      <div class="tag">Give AI Taste</div>
      <h1>让 AI <span class="ghost">有</span><br><span class="hl">设计品味</span></h1>
      <p>把认可的高审美案例，蒸馏成介质无关的视觉规范——一套品味，网页、PPT、UI、平面通吃。</p>
    </div>
    <div class="styles">
      <div class="cap">Five Styles · One Principle</div>
      <div class="list">
        <div class="item"><span class="num">01</span><span class="cn">编辑留白</span><span class="en">editorial-calm</span></div>
        <div class="item"><span class="num">02</span><span class="cn">暗夜玻璃</span><span class="en">dark-glass</span></div>
        <div class="item"><span class="num">03</span><span class="cn">暗调辉光</span><span class="en">dark-glow</span></div>
        <div class="item"><span class="num">04</span><span class="cn">撞色怪诞</span><span class="en">bold-playful</span></div>
        <div class="item"><span class="num">05</span><span class="cn">素雅极简</span><span class="en">clean-minimal</span></div>
      </div>
    </div>
    <div class="foot">
      <div class="t"><b>规范与介质解耦</b> · 审美可参数化</div>
      <div class="mark">✦</div>
    </div>
  </div>
</body>
</html>
