<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Compass · Banner · clean-minimal</title>
<!-- 风格: clean-minimal (素雅极简 · 干净呼吸) · 新闻规则: 单强调色(蓝) + 中性灰 + 块间呼吸 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FAFAF8;--ink:#1E1E1E;--dim:#6B6B6B;--faint:#B4B4AF;--blue:#2F6BFF;--line:rgba(30,30,30,.1);
    --sans:'Noto Sans SC','Montserrat',system-ui,sans-serif;--en:'Montserrat','Noto Sans SC',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#E9E9E5;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;min-height:100vh;padding:28px;-webkit-font-smoothing:antialiased}
  .banner{width:min(94vw,1100px);aspect-ratio:21/9;position:relative;background:var(--paper);border:1px solid rgba(0,0,0,.03);box-shadow:0 30px 70px rgba(0,0,0,.12);display:flex;align-items:stretch}
  .left{flex:1.5;padding:30px 36px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--en);font-weight:700;font-size:14px;margin-bottom:24px;white-space:nowrap}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--blue);flex-shrink:0;flex:none}
  .brand small{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--faint);margin-left:6px}
  .tag{font-family:var(--en);font-size:11px;letter-spacing:.22em;color:var(--blue);font-weight:700;text-transform:uppercase;margin-bottom:18px}
  h1{font-weight:900;line-height:1.02;letter-spacing:-.04em;font-size:clamp(2rem,4.4vw,3.4rem);color:var(--ink);white-space:nowrap}
  h1 .hl{color:var(--blue)} h1 .ghost{color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.5}
  .lead{margin-top:20px;font-size:13px;color:var(--dim);line-height:1.8;max-width:430px}
  .right{flex:1;padding:30px 36px;display:flex;flex-direction:column;justify-content:center}
  .right .cap{font-family:var(--en);font-size:10px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}
  .row{display:flex;align-items:baseline;gap:14px;margin:12px 0;transition:transform .5s cubic-bezier(.32,.72,0,1)}
  .row:hover{transform:translateX(3px)}
  .row .num{font-family:var(--en);font-size:12px;font-weight:700;width:26px}
  .row .cn{font-size:13.5px;font-weight:500;color:var(--ink);width:84px}
  .row .en{font-family:var(--en);font-size:11px;color:var(--dim);margin-left:auto;font-weight:500}
  .n1{color:#2F6BFF}.n2{color:#7A5AF8}.n3{color:#4A90E2}.n4{color:#E07B4A}.n5{color:#00A86B}
  .foot{position:absolute;bottom:0;left:0;right:0;padding:14px 36px;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:600}
  .foot b{color:var(--ink)}
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="brand"><span class="dot"></span> Style Compass <small>OPEN SOURCE</small></div>
      <div class="tag">Give AI Taste</div>
      <h1>让 AI <span class="ghost">有</span><span class="hl">设计品味</span></h1>
      <p class="lead">把认可的高审美案例，蒸馏成介质无关的视觉规范——一套品味，网页 / PPT / UI / 平面通吃。</p>
    </div>
    <div class="right">
      <div class="cap">Five Styles</div>
      <div class="row"><span class="num n1">01</span><span class="cn">编辑留白</span><span class="en">editorial-calm</span></div>
      <div class="row"><span class="num n2">02</span><span class="cn">暗夜玻璃</span><span class="en">dark-glass</span></div>
      <div class="row"><span class="num n3">03</span><span class="cn">暗调辉光</span><span class="en">dark-glow</span></div>
      <div class="row"><span class="num n4">04</span><span class="cn">撞色怪诞</span><span class="en">bold-playful</span></div>
      <div class="row"><span class="num n5">05</span><span class="cn">素雅极简</span><span class="en">clean-minimal</span></div>
    </div>
    <div class="foot"><span><b>规范与介质解耦</b> · 审美可参数化</span><span>✦</span></div>
  </div>
</body>
</html>
